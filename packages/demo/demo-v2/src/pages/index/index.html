<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        var __replaceUrl = ~window.location.host.indexOf('buhuida.com') ? window.location.href.replace(/.*?buhuida\.com/, 'https://form.lljj.me') : (window.location.protocol === 'http:' && ~window.location.host.indexOf('lljj.me') ? window.location.href.replace(/^http/, 'https') : '');
        __replaceUrl && window.location.replace(__replaceUrl);
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Vue JSON Schema form editor - VJSF</title>
    <meta name="description" content="vue-json-schema-form - 基于JSON Schema动态创建表单在线演示编辑器" />
</head>
<body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@lljj/polyfill@0.1.1/dist/polyfill.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-ui@2.13.1/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@3.1.3/dist/vue-router.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.30.0/min/vs/loader.js"></script>
    <script>
        if (typeof require !== 'undefined' && require.config) {
            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.30.0/min/vs' }});
        }

        try {
            // https://github.com/microsoft/monaco-editor/blob/master/docs/integrate-amd-cross.md
            window.MonacoEnvironment = {
                getWorkerUrl: function(workerId, label) {
                    const code = encodeURIComponent(`
                        self.MonacoEnvironment = {
                          baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.30.0/min/'
                        };
                        importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.30.0/min/vs/base/worker/workerMain.js');
                    `);

                    return 'data:text/javascript;charset=utf-8,' + code;
                }
            };
        } catch (e) {
            // nothing ....
        }
    </script>
</body>
</html>
